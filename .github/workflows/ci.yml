name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake clang
      - name: Generate configure
        run: autoreconf -fi
      - name: Configure
        run: ./configure CC=${{ matrix.cc }}
      - name: Build
        run: make CFLAGS="-O2 -Wall -Werror"
      - name: Test
        run: make check CFLAGS="-O2 -Wall -Werror" VERBOSE=1
      - name: Check the release tarball
        run: make distcheck

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake
      - name: Generate configure
        run: autoreconf -fi
      - name: Configure
        run: >-
          ./configure
          CFLAGS="-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=address,undefined"
      - name: Test
        run: make check VERBOSE=1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install autoconf automake
      - name: Generate configure
        run: autoreconf -fi
      - name: Configure
        run: ./configure
      - name: Build
        run: make
      - name: Test
        run: make check VERBOSE=1
